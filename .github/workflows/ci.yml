name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests create and drop their own temporary databases on this server.
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ccms-shared is vendored in vendor/ccms-shared, so there is nothing else to check out.
      - run: npm ci
      - run: npm run lint
      - name: No server-local date methods (Asia/Manila rule)
        run: npm run check:time
      - run: npm test
      - run: npm run build
